<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>поцаны хохлы</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{background:#030101;scroll-behavior:smooth}
body{min-height:100vh;background:#030101;color:#ccc0c0;font-family:'Inter',sans-serif;overflow-x:hidden;cursor:default}

/* ── FIXED CANVAS LAYERS ── */
#cv-wall,#cv-blood,#cv-maniac{position:fixed;inset:0;pointer-events:none}
#cv-wall{z-index:0}
#cv-blood{z-index:1}
#cv-maniac{z-index:2;transform-origin:bottom right}

/* ── SCROLL PROGRESS BAR ── */
#progress{
  position:fixed;top:0;left:0;height:2px;width:0%;
  background:linear-gradient(90deg,#6a0000,#cc0000);
  z-index:999;transition:width .05s linear;
  box-shadow:0 0 8px #990000;
}

/* ── PAGE ── */
.page{
  position:relative;z-index:10;
  max-width:880px;margin:0 auto;
  padding:0 24px 120px;
}

/* ── HERO ── */
.hero{
  display:flex;flex-direction:column;align-items:center;
  padding:100px 0 70px;min-height:100vh;justify-content:center;
}

.chat-ava{
  width:100px;height:100px;border-radius:50%;object-fit:cover;
  border:1px solid rgba(100,0,0,.3);
  filter:grayscale(.3) brightness(.75);
  box-shadow:0 0 60px rgba(60,0,0,.5);
  margin-bottom:32px;
  animation:ava-in 1.6s cubic-bezier(.16,1,.3,1) both,
            ava-glow 4s 2s ease-in-out infinite;
  will-change:transform,box-shadow;
}
@keyframes ava-in{
  from{opacity:0;transform:scale(.7) translateY(20px);}
  to{opacity:1;transform:scale(1) translateY(0);}
}
@keyframes ava-glow{
  0%,100%{box-shadow:0 0 60px rgba(60,0,0,.5);}
  50%{box-shadow:0 0 100px rgba(110,0,0,.65),0 0 0 6px rgba(90,0,0,.1);}
}

.hero-title{
  font-size:clamp(48px,11vw,110px);
  font-weight:900;letter-spacing:-3px;
  color:#ddd4d4;text-align:center;line-height:.95;
  text-shadow:0 0 0 transparent;
  animation:title-in 1.4s .3s cubic-bezier(.16,1,.3,1) both,
            title-glitch 9s 3s ease infinite;
  will-change:transform,opacity;
}
@keyframes title-in{
  from{opacity:0;transform:translateY(30px) scale(.97);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
@keyframes title-glitch{
  0%,88%,100%{text-shadow:none;transform:none;}
  90%{text-shadow:-2px 0 #cc0000,2px 0 #003acc;transform:skewX(-1deg);}
  92%{text-shadow:2px 0 #cc0000,-2px 0 #003acc;transform:skewX(1.5deg);}
  94%{text-shadow:none;transform:none;}
  96%{text-shadow:-1px 0 #cc0000;transform:skewX(-.5deg);}
  97%{text-shadow:none;transform:none;}
}

.scroll-hint{
  margin-top:48px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  animation:hint-in 1s 1.8s ease both;
  opacity:.4;
}
@keyframes hint-in{from{opacity:0;transform:translateY(10px);}to{opacity:.4;transform:translateY(0);}}
.scroll-hint span{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#4a2a2a;}
.scroll-arrow{
  width:1px;height:40px;
  background:linear-gradient(to bottom,#5a0000,transparent);
  animation:arrow-drip 1.5s ease-in-out infinite;
}
@keyframes arrow-drip{
  0%{transform:scaleY(0);transform-origin:top;}
  50%{transform:scaleY(1);transform-origin:top;}
  51%{transform:scaleY(1);transform-origin:bottom;}
  100%{transform:scaleY(0);transform-origin:bottom;}
}

/* ── SCROLL REVEAL ── */
.reveal{
  opacity:0;transform:translateY(32px);
  transition:opacity .9s cubic-bezier(.16,1,.3,1),
             transform .9s cubic-bezier(.16,1,.3,1);
}
.reveal.visible{opacity:1;transform:translateY(0);}

/* ── SECTION ── */
.sec{margin-bottom:44px;}
.sec-label{
  font-size:10px;font-weight:700;letter-spacing:4px;
  text-transform:uppercase;color:#580000;
  margin-bottom:14px;padding-left:10px;
  border-left:2px solid #580000;
  position:relative;
}
.sec-label::after{
  content:'';position:absolute;
  left:0;top:0;bottom:0;width:2px;
  background:#cc0000;transform:scaleY(0);transform-origin:top;
  transition:transform .6s cubic-bezier(.16,1,.3,1);
  box-shadow:0 0 8px #880000;
}
.reveal.visible .sec-label::after{transform:scaleY(1);}

/* ── CARD ── */
.card{
  background:rgba(5,1,1,.82);
  border:1px solid rgba(70,0,0,.18);
  border-radius:14px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:22px;position:relative;overflow:hidden;
  transition:border-color .4s,box-shadow .4s;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(100,0,0,.3),transparent);
}
.card:hover{
  border-color:rgba(110,0,0,.3);
  box-shadow:0 0 40px rgba(60,0,0,.2);
}

/* ── MEMBER GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;}

.member{
  display:flex;flex-direction:column;align-items:center;
  gap:8px;padding:20px 14px;
  background:rgba(3,0,0,.7);
  border:1px solid rgba(60,0,0,.15);border-radius:12px;
  cursor:pointer;position:relative;overflow:hidden;
  transition:transform .35s cubic-bezier(.16,1,.3,1),
             border-color .35s,box-shadow .35s;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.member::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(140,0,0,.12),transparent 65%);
  opacity:0;transition:opacity .35s;
}
.member:hover{
  transform:translateY(-5px) scale(1.02);
  border-color:rgba(120,0,0,.38);
  box-shadow:0 16px 40px rgba(80,0,0,.3);
}
.member:hover::after{opacity:1;}
.member:active{transform:scale(.97) translateY(-2px);}

/* blood ripple on click */
.member .ripple{
  position:absolute;border-radius:50%;
  background:rgba(150,0,0,.35);
  transform:scale(0);animation:ripple .7s ease-out forwards;
  pointer-events:none;
}
@keyframes ripple{to{transform:scale(4);opacity:0;}}

.m-img{
  width:66px;height:66px;border-radius:50%;object-fit:cover;
  filter:brightness(.8) saturate(.85);
  border:1px solid rgba(80,0,0,.22);
  transition:filter .35s,box-shadow .35s;
  position:relative;z-index:1;
}
.member:hover .m-img{
  filter:brightness(1) saturate(1);
  box-shadow:0 0 28px rgba(140,0,0,.5);
}
.m-role{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#520000;z-index:1;}
.m-name{font-size:13px;font-weight:700;color:#b0a0a0;z-index:1;}

/* ── TROLL ── */
.troll{
  display:flex;align-items:center;gap:14px;
  margin-top:10px;padding:12px 16px;
  background:rgba(3,0,0,.65);
  border:1px solid rgba(45,0,0,.18);border-radius:10px;
  cursor:pointer;position:relative;overflow:hidden;
  transition:border-color .3s,transform .3s;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.troll:hover{border-color:rgba(90,0,0,.3);transform:translateX(4px);}
.troll:active{transform:scale(.98);}
.troll img{width:46px;height:46px;border-radius:50%;object-fit:cover;filter:brightness(.75) saturate(.6);border:1px solid rgba(50,0,0,.2);}
.t-role{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#2e1010;}
.t-name{font-size:13px;font-weight:700;color:#584040;margin-top:2px;}

/* ── RULES ── */
.rules{display:flex;flex-direction:column;gap:8px;}
.rule{
  display:grid;grid-template-columns:38px 1fr;gap:12px;
  align-items:start;padding:14px 16px;
  background:rgba(3,0,0,.65);
  border:1px solid rgba(55,0,0,.14);
  border-left:2px solid rgba(80,0,0,.3);
  border-radius:10px;
  cursor:pointer;position:relative;overflow:hidden;
  transition:transform .3s cubic-bezier(.16,1,.3,1),
             border-color .3s,background .3s;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.rule::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(to bottom,#8a0000,#3a0000);
  box-shadow:0 0 6px #660000;opacity:0;
  transition:opacity .3s;
}
.rule:hover{
  transform:translateX(6px);
  background:rgba(8,0,0,.82);
  border-color:rgba(100,0,0,.28);
}
.rule:hover::before{opacity:1;}
.rule:active{transform:translateX(3px) scale(.99);}
.r-n{font-size:22px;font-weight:900;color:rgba(85,0,0,.28);line-height:1;padding-top:2px;text-align:right;}
.r-t{font-size:13px;font-weight:700;color:#b8a4a4;margin-bottom:3px;}
.r-d{font-size:12px;color:#443232;line-height:1.65;}
.r-p{margin-top:5px;font-size:11px;font-weight:700;color:#6e0000;}

/* ── RULE EXPAND (click to open) ── */
.rule-body{overflow:hidden;max-height:0;transition:max-height .5s cubic-bezier(.16,1,.3,1);}
.rule.open .rule-body{max-height:80px;}
.rule-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.rule-arrow{
  width:16px;height:16px;border-radius:50%;
  background:rgba(80,0,0,.2);display:flex;align-items:center;justify-content:center;
  font-size:9px;color:#660000;
  transition:transform .35s,background .3s;flex-shrink:0;
}
.rule.open .rule-arrow{transform:rotate(180deg);background:rgba(120,0,0,.3);}

/* ── IMPORTANT ── */
.imp{
  background:rgba(8,0,0,.76);
  border:1px solid rgba(90,0,0,.22);
  border-radius:14px;padding:22px 26px;
  margin-bottom:40px;
  position:relative;overflow:hidden;
  transition:border-color .4s,box-shadow .4s;
  cursor:default;
}
.imp:hover{border-color:rgba(130,0,0,.32);box-shadow:0 0 50px rgba(60,0,0,.18);}
.imp::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(to bottom,#8a0000,transparent);
  box-shadow:0 0 10px #660000;
}
.imp-head{font-size:10px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#6e0000;margin-bottom:12px;}
.imp p{font-size:13px;color:#483232;line-height:1.85;}

/* ── FOOTER ── */
footer{text-align:center;padding-top:8px;}
footer p{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1e0e0e;}
footer a{color:#301414;text-decoration:none;transition:color .25s;}
footer a:hover{color:#6e0000;}

/* ── CURSOR BLOOD DROPS ── */
.blood-drop{
  position:fixed;pointer-events:none;z-index:998;
  border-radius:50%;background:#7a0000;
  animation:drop-out .65s ease-out forwards;
}
@keyframes drop-out{
  0%{transform:scale(0);opacity:.8;}
  60%{opacity:.7;}
  100%{transform:scale(3.5) translateY(8px);opacity:0;}
}

/* ── SCANLINE OVERLAY ── */
body::after{
  content:'';position:fixed;inset:0;z-index:998;pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    rgba(0,0,0,.04) 0px,rgba(0,0,0,.04) 1px,
    transparent 1px,transparent 3px
  );
}
</style>
</head>
